[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
addopts = --strict-markers --strict-config
filterwarnings =
    error
    # Fixture-level artefact, diagnosed in v1.13: the test session is closed
    # while a transaction is still associated. Not a production code issue.
    ignore:transaction already deassociated from connection:sqlalchemy.exc.SAWarning